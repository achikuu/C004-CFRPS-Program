<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cainta Flood Rescue Prioritization System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f7f9f3;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header{
    background:#447fa9;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 48px;
}

.logo-container{
    display:flex;
    align-items:center;
    gap:15px;
}

.header-logo{
    width:60px;
    height:60px;
    object-fit:contain;
}

.logo-container h1{
    font-size:20px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:15px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    padding:10px 20px;
    border-radius:25px;
    transition:0.3s ease;
    font-weight:bold;
}

.nav-links a:hover{
    background:#234f70;
    color:white;
}

.main-container{
    max-width:1200px;
    width:100%;
    margin:auto;
    padding:50px;
    flex:1;
}

.content-wrapper{
    display:flex;
    align-items:center;
    gap:80px;
}

.map-container{
    width:450px;
    height:380px;
    border:1px solid #ccc;
    border-radius:5px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.form-container{
    flex:1;
}

.form-container h2{
    color:#0b3c5d;
    font-size:32px;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:25px;
}

.form-group label{
    display:block;
    margin-bottom:10px;
    color:#0b3c5d;
    font-size:20px;
    font-weight:bold;
}

.form-group select{
    width:320px;
    padding:12px;
    font-size:16px;
    border:2px solid black;
    cursor:pointer;

    appearance:none;
    -webkit-appearance:none;

    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

    background-repeat:no-repeat;
    background-position:right 15px center;
    background-size:14px;
}

.form-group select:focus{
    outline:2px solid #447fa9;
}

.footer-controls{
    margin-top:40px;
    display:flex;
    justify-content:space-between;
}

.btn-nav{
    text-decoration:none;
    color:black;
    font-weight:bold;
    padding:10px 20px;
    border-radius:25px;
    transition:0.3s ease;
}

.btn-nav:hover{
    background:#447fa9;
    color:white;
}

@media(max-width:900px){

    .content-wrapper{
        flex-direction:column;
    }

    .map-container{
        width:100%;
        max-width:500px;
    }

    .form-group select{
        width:100%;
        max-width:320px;
    }

    .header{
        flex-direction:column;
        gap:15px;
        text-align:center;
    }
}

</style>

</head>

<body>

<header class="header">

    <div class="logo-container">

        <img src="logo.png" alt="CFRPS Logo" class="header-logo">

        <h1>CAINTA FLOOD RESCUE PRIORITIZATION SYSTEM</h1>

    </div>

    <nav class="nav-links">
        <a href="TAB1-home.html">HOME</a>
        <a href="TAB2-about-us.html">ABOUT US</a>
        <a href="TAB3-hotlines.html">HOTLINES</a>
        <a href="TAB4-login.html">LOGIN</a>
    </nav>

</header>

<main class="main-container">

    <div class="content-wrapper">

        <div class="map-container">

            <iframe
                src="https://www.openstreetmap.org/export/embed.html?bbox=121.10%2C14.57%2C121.14%2C14.61&layer=mapnik"
                width="100%"
                height="100%"
                style="border:0;">
            </iframe>

        </div>

        <div class="form-container">

            <h2>ENTER YOUR LOCATION</h2>

            <form>

                <div class="form-group">
                    <label for="barangay">Barangay</label>

                    <select id="barangay">
                        <option value="" selected></option>
                        <option>San Andres</option>
                        <option>San Juan</option>
                        <option>San Roque</option>
                        <option>Santa Rosa</option>
                        <option>Santo Domingo</option>
                        <option>Santo Niño</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="street">Street</label>

                    <select id="street">
                        <option value="" selected></option>
                        <option>Ortigas Ave Extension</option>
                        <option>Imelda / Felix Ave</option>
                        <option>A. Bonifacio Ave</option>
                        <option>Vista Verde Subdivision</option>
                        <option>Greenland Executive Village</option>
                    </select>
                </div>

            </form>

        </div>

    </div>

    <div class="footer-controls">

        <a href="TAB1-home.html" class="btn-nav">BACK</a>

        <a href="PAGE2-risk-assessment.html" class="btn-nav">NEXT</a>

    </div>

</main>

</body>
</html>
