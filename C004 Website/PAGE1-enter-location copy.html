<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFRPS</title>

    <link rel="stylesheet" href="header-stylesheet.css">
</head>

<body>
    
    <header>
        <nav class="nav-bar">

            <div class="logo">
                <img src="assets/LOGO.png" alt="CFRPS-LOGO" width="100" height="100" class="nav-logo">
                <h1 class="logo-text">Cainta Flood Rescue Prioritization System</h1>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="TAB1-home.html" class="nav-link">HOME</a> 
                </li>
                <li class="nav-item">
                    <a href="TAB2-about-us.html" class="nav-link">ABOUT US</a> 
                </li>
                <li class="nav-item">
                    <a href="TAB3-hotlines.html" class="nav-link">HOTLINES</a> 
                </li>
                <li class="nav-item">
                    <a href="TAB4-login.html" class="nav-link">LOGIN</a> 
                </li>
            </ul>

        </nav>
    </header>


<main class="main-container">

    <div class="content-wrapper">

        <div class="map-container">

            <iframe
                src="https://www.openstreetmap.org/export/embed.html?bbox=121.10%2C14.57%2C121.14%2C14.61&layer=mapnik"
                width="100%"
                height="100%"
                style="border:0;">
            </iframe>

        </div>

        <div class="form-container">

            <h2>ENTER YOUR LOCATION</h2>

            <form>

                <div class="form-group">
                    <label for="barangay">Barangay</label>

                    <select id="barangay" onchange="changeStreetDropdown(this.value)">
                        <option value="" selected></option>
                        <option value="San Andres">San Andres</option>
                        <option value="San Juan">San Juan</option>
                        <option value="San Roque">San Roque</option>
                        <option value="Santa Rosa">Santa Rosa</option>
                        <option value="Santo Domingo">Santo Domingo</option>
                        <option value="Santo Niño">Santo Niño</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="street">Street</label>

                    <select id="street">
                        <option value="" selected></option>
                    </select>
                </div>
            </form>
                <div id="validationMsg" style="color:red;margin-top:10px;font-weight:bold;"></div>
        </div>
    </div>

    <div class="footer-controls">

        <a href="TAB1-home.html" class="btn-nav">BACK</a>
        <a href="PAGE2-risk-assessment.html" class="btn-nav" onclick="return validateRouting()">NEXT</a>

    </div>

</main>

<script>
    const streetsByBarangay = {
        "San Andres": ["Planters Subdivision", "New anyo Street", "Cainta Greenland Phase 4", "Filinvest Homes East"],
        "San Juan": ["Brookside Hills Subdivision", "Velasquez Street", "Sito Parola", "Greenland Subdivision"],
        "San Roque": ["Marick Subdivision", "Town Proper", "J. Tolentino Street"],
        "Santa Rosa": ["Suburban Villa", "Imelda Avenue Corridor", "Sito Sta. Elena"],
        "Santo Domingo": ["Vista Verde Executive Village", "Cypress Village", "Orchard Residential Estate"],
        "Santo Niño": ["Rizal Avenue", "Mabini Street"]
    };

    function changeStreetDropdown(barangay) {
        const streetSelect = document.getElementById('street');
        // tanggalin ung laman
        while (streetSelect.firstChild) {
            streetSelect.removeChild(streetSelect.firstChild);
        }
        const emptyOpt = document.createElement('option');
        emptyOpt.value = '';
        emptyOpt.selected = true;
        emptyOpt.textContent = '';
        streetSelect.appendChild(emptyOpt);

        if (!barangay || !streetsByBarangay[barangay]) return;

        streetsByBarangay[barangay].forEach(st => {
            const opt = document.createElement('option');
            opt.value = st;
            opt.textContent = st;
            streetSelect.appendChild(opt);
        });
    }
    document.addEventListener('DOMContentLoaded', function() {
        const barangaySelect = document.getElementById('barangay');
        changeStreetDropdown(barangaySelect.value);
    });

    
    // validation
    function validateRouting() {
    const brgy = document.getElementById('barangay').value;
    const street = document.getElementById('street').value;
    const msgEl = document.getElementById('validationMsg');

    if (!brgy) {
        if (msgEl) msgEl.textContent = 'Please select a barangay.';
        else alert('Please select a barangay.');
        document.getElementById('barangay').focus();
        return false;
    }

    if (!street) {
        if (msgEl) msgEl.textContent = 'Please select a street.';
        else alert('Please select a street.');
        document.getElementById('street').focus();
        return false;
    }

    localStorage.setItem('temp_barangay', brgy);
    localStorage.setItem('temp_street', street);

    return true;
}
</script>

</script>

</body>
<style> 
    .main-container{
    max-width:1200px;
    width:100%;
    margin:auto;
    padding:50px;
    flex:1;
}

.content-wrapper{
    display:flex;
    align-items:center;
    gap:80px;
}

.map-container{
    width:450px;
    height:380px;
    border:1px solid #ccc;
    border-radius:5px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.form-container{
    flex:1;
}

.form-container h2{
    color:#0b3c5d;
    font-size:32px;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:25px;
}

.form-group label{
    display:block;
    margin-bottom:10px;
    color:#0b3c5d;
    font-size:20px;
    font-weight:bold;
}

.form-group select{
    width:320px;
    padding:12px;
    font-size:16px;
    border:2px solid black;
    cursor:pointer;

    appearance:none;
    -webkit-appearance:none;

    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

    background-repeat:no-repeat;
    background-position:right 15px center;
    background-size:14px;
}

.form-group select:focus{
    outline:2px solid #447fa9;
}

.footer-controls{
    margin-top:40px;
    display:flex;
    justify-content:space-between;
}

.btn-nav{
    text-decoration:none;
    color:black;
    font-weight:bold;
    padding:10px 20px;
    border-radius:25px;
    transition:0.3s ease-in-out;
}

.btn-nav:hover{
    background:#FE7743;
    color:white;
}

</style>

</html>
