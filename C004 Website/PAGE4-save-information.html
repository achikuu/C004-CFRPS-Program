<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal Access - One Cainta</title>
    <style>
        /* --- BRAND DESIGN PALETTE CONTEXT --- */
        :root {
            --cainta-dark-navy: #0F2854;    /* Primary Header & Strong Buttons */
            --cainta-royal-blue: #1C4D8D;   /* Secondary Navigation Elements */
            --cainta-mid-blue: #4988C4;     /* Interactive Hover States & Accents */
            --cainta-soft-aqua: #BDE8F5;    /* Subtle Background Fills & Borders */
            --body-bg: #f4f7fa;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- OFFICIAL CAINTA WEB HEADER PARADIGM --- */
        header {
            background: #ffffff;
            width: 100%;
            height: 110px;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--cainta-dark-navy);
            box-shadow: 0 4px 10px rgba(15, 40, 84, 0.06);
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* Exact Visual Anchor Dimensions from Government UI Layout */
        .gov-seal-placeholder {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, var(--cainta-dark-navy), var(--cainta-royal-blue));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            padding: 4px;
            border: 2px solid var(--cainta-soft-aqua);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .title-block h1 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--cainta-dark-navy);
            letter-spacing: -0.3px;
            text-transform: uppercase;
        }

        .title-block h2 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--cainta-mid-blue);
            margin-top: 2px;
        }

        /* Nav Tab Row: Persistent State Architecture */
        .navigation-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-item {
            background: transparent;
            color: var(--cainta-royal-blue);
            border: 2px solid var(--cainta-royal-blue);
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .tab-item:hover {
            background: var(--cainta-soft-aqua);
            border-color: var(--cainta-mid-blue);
            color: var(--cainta-dark-navy);
        }

        .tab-item.active {
            background: var(--cainta-dark-navy);
            border-color: var(--cainta-dark-navy);
            color: #ffffff;
        }

        /* --- ACCOUNT AUTHENTICATION PORTAL CORE VIEW --- */
        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(189, 232, 245, 0.3) 100%);
        }

        .auth-card-scaffold {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            padding: 40px 35px;
            border: 1px solid rgba(73, 136, 196, 0.25);
            box-shadow: 0 10px 25px -5px rgba(15, 40, 84, 0.1), 
                        0 8px 16px -6px rgba(15, 40, 84, 0.05);
        }

        .auth-card-head {
            text-align: left;
            margin-bottom: 28px;
        }

        .auth-card-head h3 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--cainta-dark-navy);
            letter-spacing: -0.5px;
        }

        .auth-card-head p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        /* Form Components Layout Grid */
        .form-row {
            margin-bottom: 20px;
        }

        .form-row label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--cainta-royal-blue);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control-input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-dark);
            background-color: #f8fafc;
            outline: none;
            transition: all 0.15s ease-in-out;
        }

        .form-control-input:focus {
            border-color: var(--cainta-mid-blue);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(73, 136, 196, 0.15);
        }

        /* Specifying right padding on password row for the custom placement utility anchor */
        .form-control-input.pass-field {
            padding-right: 44px;
        }

        .password-reveal-trigger {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-reveal-trigger:hover {
            color: var(--cainta-royal-blue);
        }

        .password-reveal-trigger svg {
            width: 20px;
            height: 20px;
        }

        /* Interactive Action Buttons Architecture */
        .action-container-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-portal-action {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-align: center;
            transition: all 0.15s ease-in-out;
        }

        /* Action 1: Commit and Validate Sign-In */
        .btn-portal-action.btn-submit {
            background-color: var(--cainta-dark-navy);
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(15, 40, 84, 0.2);
        }

        .btn-portal-action.btn-submit:hover {
            background-color: var(--cainta-royal-blue);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(15, 40, 84, 0.25);
        }

        .btn-portal-action.btn-submit:active {
            transform: translateY(0);
        }

        /* Action 2: Operational Rollback Command */
        .btn-portal-action.btn-cancel {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-portal-action.btn-cancel:hover {
            background-color: #cbd5e1;
            color: var(--text-dark);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-section">
            <div class="gov-seal-placeholder">
                CAINTA<br>SEAL
            </div>
            <div class="title-block">
                <h1>Municipality of Cainta</h1>
                <h2>Flood Rescue Prioritization System (CFRPS)</h2>
            </div>
        </div>
        
        <nav class="navigation-tabs">
            <button class="tab-item">Home</button>
            <button class="tab-item">About Us</button>
            <button class="tab-item">Hotlines</button>
            <button class="tab-item active">Login / Signup</button>
        </nav>
    </header>

    <main>
        <div class="auth-card-scaffold">
            <div class="auth-card-head">
                <h3>Would you like to save this information?</h3>
                <p>Log in or create accounts to synchronize tracking history.</p>
            </div>

            <form id="cfrps-auth-form" onsubmit="handlePortalValidation(event)">
                <div class="form-row">
                    <label for="identity-input">Municipal Identity Number / Email</label>
                    <input 
                        type="text" 
                        id="identity-input" 
                        class="form-control-input" 
                        placeholder="JuanDelaCruz69@gmail.com" 
                        required
                    >
                </div>

                <div class="form-row">
                    <label for="secret-key-input">Password Account Key</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="secret-key-input" 
                            class="form-control-input pass-field" 
                            placeholder="••••••" 
                            required
                        >

                            <svg id="eye-icon" xmlns="
